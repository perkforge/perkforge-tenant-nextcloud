name: sso-image-review
on: workflow_dispatch
permissions: {contents: read}
jobs:
  build-review-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Assemble verified public app and immutable base
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/sso-context" "$RUNNER_TEMP/sso-output"
        cp sso/Dockerfile sso/artifact.yaml "$RUNNER_TEMP/sso-context/"
        curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 -o "$RUNNER_TEMP/sso-context/user_oidc.tar.gz" https://github.com/nextcloud-releases/user_oidc/releases/download/v8.13.0/user_oidc-v8.13.0.tar.gz
        echo "6f13fa0477144a6812d8648626c64cee91807d1d0b60ca41424543086b9e2775  $RUNNER_TEMP/sso-context/user_oidc.tar.gz" | sha256sum -c -
        docker pull docker.io/library/nextcloud:35.0.2-apache@sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
    - name: Build without runtime network and inspect as UID33
      shell: bash
      run: |
        set -euo pipefail
        docker build --pull=false --network=none -t nextcloud-sso-review:35.0.2-oidc8.13.0 "$RUNNER_TEMP/sso-context"
        docker run --rm --network=none --user 33 --entrypoint php nextcloud-sso-review:35.0.2-oidc8.13.0 -r '$x=simplexml_load_file("/opt/perkforge/apps/user_oidc/appinfo/info.xml");if((string)$x->version!=="8.13.0"||!is_readable("/opt/perkforge/apps/user_oidc/vendor/autoload.php")||is_writable("/opt/perkforge/apps/user_oidc")){exit(1);}'
        docker save nextcloud-sso-review:35.0.2-oidc8.13.0 -o "$RUNNER_TEMP/sso-output/image.tar"
        docker image inspect nextcloud-sso-review:35.0.2-oidc8.13.0 > "$RUNNER_TEMP/sso-output/image-inspect.json"
        sha256sum "$RUNNER_TEMP/sso-output/image.tar" > "$RUNNER_TEMP/sso-output/image.tar.sha256"
        printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/sso-output/source-commit"
        cp sso/artifact.yaml "$RUNNER_TEMP/sso-output/"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: nextcloud-sso-image-review
        path: ${{ runner.temp }}/sso-output
        retention-days: 7
