name: offline-nextcloud
on: [push, pull_request]
permissions: {contents: read}
jobs:
  render:
    runs-on: ubuntu-24.04
    env: {KUBECONFIG: /dev/null}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Fetch versioned verification tools and official chart
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/nextcloud-tools"
        cd "$RUNNER_TEMP/nextcloud-tools"
        curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 -o helm.tgz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
        curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 -o helm.sha https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
        sed 's/helm-v3.19.0-linux-amd64.tar.gz/helm.tgz/' helm.sha | sha256sum -c -
        tar -xzf helm.tgz
        curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 -o nextcloud-9.4.1.tgz https://github.com/nextcloud/helm/releases/download/nextcloud-9.4.1/nextcloud-9.4.1.tgz
        echo 'e3d768864800bcc23eb66e6f65cbf5f0545b1506cf8c65f55a91d21af3bad4bf  nextcloud-9.4.1.tgz' | sha256sum -c -
        echo "HELM=$RUNNER_TEMP/nextcloud-tools/linux-amd64/helm" >> "$GITHUB_ENV"
        echo "NEXTCLOUD_CHART=$RUNNER_TEMP/nextcloud-tools/nextcloud-9.4.1.tgz" >> "$GITHUB_ENV"
    - name: Verify rendered contracts and PHP probe syntax without cluster access
      run: |
        python3 -m pip install PyYAML==6.0.3 ansible-core==2.19.3
        curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 -o "$RUNNER_TEMP/user_oidc-v8.13.0.tar.gz" https://github.com/nextcloud-releases/user_oidc/releases/download/v8.13.0/user_oidc-v8.13.0.tar.gz
        echo "6f13fa0477144a6812d8648626c64cee91807d1d0b60ca41424543086b9e2775  $RUNNER_TEMP/user_oidc-v8.13.0.tar.gz" | sha256sum -c -
        NEXTCLOUD_OIDC_ARCHIVE="$RUNNER_TEMP/user_oidc-v8.13.0.tar.gz" python3 -m unittest discover -s tests -v
        php -l scripts/verify_database_tls.php
        php -l sso/verify-provider-secret.php
        php sso/verify-provider-secret.php
        php -l sso/verify-provider-inventory.php
        php sso/verify-provider-inventory.php
        php -l sso/verify-discovery.php
        php sso/verify-discovery.php
        git diff --check
