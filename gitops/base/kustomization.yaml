apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- releases.yaml
configMapGenerator:
- name: nextcloud-defaults
  files: [values.yaml=app-values.yaml]
- name: nextcloud-data-defaults
  files: [values.yaml=data-values.yaml]
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
