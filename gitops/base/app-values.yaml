fullnameOverride: nextcloud
replicaCount: 1
image:
  registry: docker.io
  repository: library/nextcloud
  tag: 35.0.2-apache@sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
  flavor: apache
podLabels:
  platform.perkforge.io/tenant: home
  platform.perkforge.io/application: nextcloud
internalDatabase:
  enabled: false
externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-db-rw.tenant-home-nextcloud.svc.cluster.local
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db-app
    usernameKey: username
    passwordKey: password
postgresql:
  enabled: false
mariadb:
  enabled: false
redis:
  enabled: false
externalRedis:
  enabled: false
collabora:
  enabled: false
rbac:
  enabled: false
nginx:
  enabled: false
nextcloud:
  host: nextcloud.invalid
  trustedDomains:
  - nextcloud.invalid
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: username
    passwordKey: password
  strategy:
    type: Recreate
  securityContext:
    runAsNonRoot: true
    runAsUser: 33
    runAsGroup: 33
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33
    seccompProfile:
      type: RuntimeDefault
    sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: '0'
  extraEnv:
  - name: APACHE_RUN_DIR
    value: /tmp/apache2
  - name: APACHE_LOCK_DIR
    value: /tmp/apache2
  - name: APACHE_PID_FILE
    value: /tmp/apache2.pid
  - name: PHP_MEMORY_LIMIT
    value: 192M
  - name: PHP_UPLOAD_LIMIT
    value: 256M
  - name: PGSSLMODE
    value: verify-full
  - name: PGSSLROOTCERT
    value: /etc/nextcloud-postgres-ca/ca.crt
  phpConfigs:
    zz-perkforge.ini: 'memory_limit=192M

      upload_max_filesize=256M

      post_max_size=256M

      opcache.memory_consumption=64

      '
  configs:
    postgres-tls.config.php: |
      <?php
      $CONFIG = ['pgsql_ssl' => [
        'mode' => 'verify-full',
        'rootcert' => '/etc/nextcloud-postgres-ca/ca.crt',
      ]];
    perkforge.config.php: "<?php\n$CONFIG = [\n  'overwriteprotocol' => 'https',\n\
      \  'appstoreenabled' => false,\n  'log_type' => 'errorlog',\n];\n"
  extraVolumes:
  - name: postgres-ca
    configMap:
      name: nextcloud-db-ca
  - name: apache-budget
    configMap:
      name: nextcloud-apache-budget
  extraVolumeMounts:
  - name: postgres-ca
    mountPath: /etc/nextcloud-postgres-ca
    readOnly: true
  - name: apache-budget
    mountPath: /etc/apache2/mods-enabled/mpm_prefork.conf
    subPath: mpm_prefork.conf
    readOnly: true
  extraInitContainers:
  - name: prepare-persistent-directories
    image: docker.io/library/nextcloud:35.0.2-apache@sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
    command:
    - sh
    - -ec
    - "umask 007\nfor directory in root html config data custom_apps tmp themes; do\n\
      \  mkdir -p \"/bootstrap/$directory\"\n  test \"$(stat -c %u \"/bootstrap/$directory\"\
      )\" = \"$(id -u)\"\n  chmod 0770 \"/bootstrap/$directory\"\ndone\n"
    securityContext:
      runAsNonRoot: true
      runAsUser: 33
      runAsGroup: 33
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: nextcloud-main
      mountPath: /bootstrap
  hooks:
    before-starting: 'php /var/www/html/occ background:cron

      '
persistence:
  enabled: true
  existingClaim: nextcloud-files
resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: 750m
    memory: 512Mi
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: false
cronjob:
  enabled: true
  type: cronjob
  cronjob:
    # First install: web must finish UID33 directory and instance initialization first.
    suspend: true
    schedule: '*/5 * * * *'
    activeDeadlineSeconds: 900
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    securityContext:
      runAsNonRoot: true
      runAsUser: 33
      runAsGroup: 33
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
    command:
    - php
    - -d
    - memory_limit=96M
    - -f
    - /var/www/html/cron.php
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: nextcloud
              app.kubernetes.io/instance: nextcloud
              app.kubernetes.io/component: app
          topologyKey: kubernetes.io/hostname
metrics:
  enabled: false
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 90
  successThreshold: 1
readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
livenessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1
podAnnotations:
  platform.perkforge.io/apache-profile: serial-no-keepalive-v1
extraManifests:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: nextcloud-apache-budget
  data:
    mpm_prefork.conf: 'StartServers 1

      MinSpareServers 1

      MaxSpareServers 1

      ServerLimit 1

      MaxRequestWorkers 1

      MaxConnectionsPerChild 500

      KeepAlive Off

      '
- |
  {{- if eq .Values.filesStorage.storageClass "REVIEW_REQUIRED" }}
  {{- fail "Select an operator-reviewed durable StorageClass before rendering files resources" }}
  {{- end }}
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: nextcloud-files
    annotations:
      helm.sh/resource-policy: keep
  spec:
    accessModes: [ReadWriteOnce]
    storageClassName: {{ .Values.filesStorage.storageClass | quote }}
    resources:
      requests:
        storage: {{ .Values.filesStorage.size | quote }}
filesStorage:
  storageClass: REVIEW_REQUIRED
  size: 4Gi
