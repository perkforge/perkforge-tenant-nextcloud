- ansible.builtin.assert:
    that:
    - nextcloud_provider_id | int > 0
    - nextcloud_subject is match('^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$')
- ansible.builtin.command:
    argv: '{{ nc_occ + ["user_oidc:providers","--output=json"] }}'
  changed_when: false
  register: nc_subject_provider
- ansible.builtin.assert:
    that:
    - nc_subject_provider.stdout_lines | length == 1
    - (nc_subject_provider.stdout_lines[0] | from_json).id | int == nextcloud_provider_id | int
    - (nc_subject_provider.stdout_lines[0] | from_json).identifier == 'perkforge-nextcloud'
    - (nc_subject_provider.stdout_lines[0] | from_json).clientId == 'nextcloud'
    - (nc_subject_provider.stdout_lines[0] | from_json).discoveryEndpoint == nextcloud_sso_issuer + '/.well-known/openid-configuration'
    - (nc_subject_provider.stdout_lines[0] | from_json).settings.uniqueUid == true
    - (nc_subject_provider.stdout_lines[0] | from_json).settings.mappingUid == 'sub'
- ansible.builtin.set_fact:
    nc_subject_uid: '{{ ((nextcloud_provider_id | int | string) + "_0_" + nextcloud_subject) | hash("sha256") }}'
- ansible.builtin.assert:
    that: nc_subject_uid != nextcloud_recovery_user
- ansible.builtin.command:
    argv: '{{ nc_occ + ["user:info",nc_subject_uid,"--output=json"] }}'
  changed_when: false
  register: nc_subject_info
- ansible.builtin.assert:
    that:
    - (nc_subject_info.stdout | from_json).user_id == nc_subject_uid
    - (nc_subject_info.stdout | from_json).backend == 'user_oidc'
- when: nextcloud_native_operation in ['grant-admin','resume-subject']
  block:
  - ansible.builtin.assert:
      that:
      - nextcloud_client_uuid is match('^[A-Za-z0-9-]+$') and nextcloud_client_uuid != 'UNCONFIGURED'
      - nextcloud_native_operation != 'grant-admin' or (nc_subject_info.stdout | from_json).enabled
  - ansible.builtin.stat:
      path: '{{ nextcloud_keycloak_token_file }}'
      follow: false
    register: nc_grant_token
  - ansible.builtin.assert:
      that:
      - nextcloud_keycloak_token_file is match('^/') and nextcloud_keycloak_token_file | realpath == nextcloud_keycloak_token_file
      - nc_grant_token.stat.isreg | default(false)
      - not (nc_grant_token.stat.islnk | default(false))
      - nc_grant_token.stat.mode == '0600' and nc_grant_token.stat.pw_name == lookup('env','USER')
  - ansible.builtin.uri:
      url: '{{ nextcloud_sso_issuer | regex_replace("/realms/perkforge$","/admin/realms/perkforge") }}/clients/{{ nextcloud_client_uuid }}'
      headers: {Authorization: 'Bearer {{ lookup("file",nextcloud_keycloak_token_file) | trim }}'}
      ca_path: '{{ nextcloud_ca_file }}'
      validate_certs: true
      use_proxy: false
      use_netrc: false
      follow_redirects: none
      unredirected_headers: [Authorization]
    register: nc_owner_client
  - ansible.builtin.assert:
      that:
      - nc_owner_client.json.id == nextcloud_client_uuid
      - nc_owner_client.json.clientId == 'nextcloud'
      - nc_owner_client.json.attributes['perkforge-purpose'] == 'nextcloud-sso-review-v1'
      - nc_owner_client.json.attributes['perkforge-managed'] == 'true'
      - not nc_owner_client.json.fullScopeAllowed
  - ansible.builtin.uri:
      url: '{{ nextcloud_sso_issuer | regex_replace("/realms/perkforge$","/admin/realms/perkforge") }}/users/{{ nextcloud_subject }}/role-mappings/clients/{{ nextcloud_client_uuid }}'
      headers: {Authorization: 'Bearer {{ lookup("file",nextcloud_keycloak_token_file) | trim }}'}
      ca_path: '{{ nextcloud_ca_file }}'
      validate_certs: true
      use_proxy: false
      use_netrc: false
      follow_redirects: none
      unredirected_headers: [Authorization]
    register: nc_owner_grant
  - ansible.builtin.assert:
      that:
      - nc_owner_grant.json | length == 1
      - nc_owner_grant.json[0].name in ['household','owner']
      - nextcloud_native_operation != 'grant-admin' or nc_owner_grant.json[0].name == 'owner'
      - nc_owner_grant.json[0].clientRole and not nc_owner_grant.json[0].composite
      - nc_owner_grant.json[0].containerId == nextcloud_client_uuid
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["group:adduser","admin",nc_subject_uid] }}'
    when: nextcloud_native_operation == 'grant-admin' and 'admin' not in (nc_subject_info.stdout | from_json).groups
    changed_when: true
- when: nextcloud_native_operation == 'resume-subject'
  block:
  - ansible.builtin.assert:
      that: "'admin' not in (nc_subject_info.stdout | from_json).groups"
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["user:enable",nc_subject_uid] }}'
    when: not (nc_subject_info.stdout | from_json).enabled
    changed_when: true
- when: nextcloud_native_operation == 'remove-subject'
  block:
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["user:disable",nc_subject_uid] }}'
    when: (nc_subject_info.stdout | from_json).enabled
    changed_when: true
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["group:removeuser","admin",nc_subject_uid] }}'
    when: '"admin" in (nc_subject_info.stdout | from_json).groups'
    changed_when: true
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["user:auth-tokens:list",nc_subject_uid,"--output=json"] }}'
    changed_when: false
    register: nc_subject_tokens
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["user:auth-tokens:delete",nc_subject_uid,item.id | string] }}'
    loop: '{{ nc_subject_tokens.stdout | from_json }}'
    changed_when: true
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["user:auth-tokens:list",nc_subject_uid,"--output=json"] }}'
    changed_when: false
    register: nc_subject_tokens_after
  - ansible.builtin.assert:
      that: nc_subject_tokens_after.stdout | from_json | length == 0
- ansible.builtin.command:
    argv: '{{ nc_occ + ["user:info",nc_subject_uid,"--output=json"] }}'
  changed_when: false
  register: nc_subject_after
- ansible.builtin.assert:
    that:
    - nextcloud_native_operation != 'remove-subject' or (not (nc_subject_after.stdout | from_json).enabled and 'admin' not in (nc_subject_after.stdout | from_json).groups)
    - nextcloud_native_operation != 'grant-admin' or 'admin' in (nc_subject_after.stdout | from_json).groups
- ansible.builtin.command:
    argv: '{{ nc_occ + ["user:info",nextcloud_recovery_user,"--output=json"] }}'
  changed_when: false
  register: nc_recovery_after
- ansible.builtin.assert:
    that:
    - (nc_recovery_after.stdout | from_json).user_id == nextcloud_recovery_user
    - (nc_recovery_after.stdout | from_json).backend == 'Database'
    - (nc_recovery_after.stdout | from_json).enabled
    - "'admin' in (nc_recovery_after.stdout | from_json).groups"
