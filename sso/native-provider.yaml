- ansible.builtin.command:
    argv: '{{ nc_occ + ["config:list","--output=json"] }}'
  changed_when: false
  register: nc_configuration
- ansible.builtin.assert:
    that:
    - (nc_configuration.stdout | from_json).system.user_oidc | default({}) == nc_system
    - not ((nc_configuration.stdout | from_json).system.debug | default(false))
    - (nc_configuration.stdout | from_json).apps.user_oidc.allow_multiple_user_backends == '1'
- ansible.builtin.command:
    argv: '{{ nc_occ + ["user_oidc:providers","--output=json"] }}'
  changed_when: false
  register: nc_providers
- ansible.builtin.set_fact:
    nc_provider_records: '{{ nc_providers.stdout_lines | map("from_json") | list }}'
- name: Refuse adoption, multiple providers, issuer/client/scope drift or changed numeric identity
  ansible.builtin.assert:
    that:
    - nc_provider_records | length <= 1
    - nc_provider_records | length == 1 or nextcloud_native_operation == 'apply'
- ansible.builtin.assert:
    that:
    - item.identifier == 'perkforge-nextcloud'
    - item.clientId == 'nextcloud'
    - item.discoveryEndpoint == nextcloud_sso_issuer + '/.well-known/openid-configuration'
    - item.scope == 'openid'
    - item.id | int == nextcloud_provider_id | int and nextcloud_provider_id | int > 0
    - item.settings.uniqueUid == true
    - item.settings.mappingUid == 'sub'
    - item.settings.mappingGroups == 'nextcloud_roles'
    - item.settings.restrictLoginToGroups == true
    - item.settings.groupProvisioning == false
    - item.settings.checkBearer == false and item.settings.bearerProvisioning == false
    - item.settings.groupWhitelistRegex in [nc_allow,nc_deny]
    - item.settings.nestedAndFallbackClaims == false
    - item.settings.enrichLoginIdTokenWithUserinfo == false
  loop: '{{ nc_provider_records }}'
- ansible.builtin.include_tasks: native-credential-check.yaml
  vars:
    nc_credential_provider_id: '{{ nc_provider_records[0].id }}'
  when: nc_provider_records | length == 1 and nextcloud_native_operation in ['inspect','apply','activate']
- when: nextcloud_native_operation == 'apply'
  block:
  - ansible.builtin.assert:
      that:
      - nextcloud_private_http_approval == 'oidc-private-issuer-egress-v1'
      - nextcloud_ca_sha256 is match('^[a-f0-9]{64}$')
      - nextcloud_secret_sha256 is match('^[a-f0-9]{64}$')
  - ansible.builtin.command:
      argv: '{{ nc_exec + ["sha256sum","/run/nextcloud-oidc/client-secret","/etc/nextcloud-oidc/ca.crt"] }}'
    changed_when: false
    register: nc_mount_hashes
  - ansible.builtin.assert:
      that:
      - nc_mount_hashes.stdout_lines[0].split()[0] == nextcloud_secret_sha256
      - nc_mount_hashes.stdout_lines[1].split()[0] == nextcloud_ca_sha256
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["security:certificates:export"] }}'
    changed_when: false
    register: nc_trust
  - ansible.builtin.command:
      argv: '{{ nc_exec + ["cat","/etc/nextcloud-oidc/ca.crt"] }}'
    changed_when: false
    register: nc_ca
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["security:certificates:import","/etc/nextcloud-oidc/ca.crt"] }}'
    when: nc_ca.stdout | trim not in nc_trust.stdout
    changed_when: true
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["config:system:set","allow_local_remote_servers","--type=boolean","--value=true"] }}'
    when: not ((nc_configuration.stdout | from_json).system.allow_local_remote_servers | default(false))
    changed_when: true
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["user_oidc:provider","perkforge-nextcloud","--clientid=nextcloud","--clientsecret-file=/run/nextcloud-oidc/client-secret","--discoveryuri=" + nextcloud_sso_issuer + "/.well-known/openid-configuration","--scope=openid","--mapping-uid=sub","--unique-uid=1","--mapping-groups=nextcloud_roles","--group-provisioning=0","--group-restrict-login-to-whitelist=1","--group-whitelist-regex=" + nc_deny,"--check-bearer=0","--bearer-provisioning=0","--resolve-nested-claims=0"] }}'
    when: nc_provider_records | length == 0
    changed_when: true
- when: nextcloud_native_operation in ['apply','activate']
  block:
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["config:system:get","allow_local_remote_servers"] }}'
    changed_when: false
    register: nc_private_http
  - ansible.builtin.assert:
      that: nc_private_http.stdout == 'true'
  - ansible.builtin.command:
      argv: '{{ nc_k + ["-n","tenant-home-nextcloud","exec","-i",nextcloud_pod,"-c","nextcloud","--","php","--","--run",nextcloud_sso_issuer] }}'
      stdin: '{{ lookup("file","verify-discovery.php") }}'
    changed_when: false
- when: nextcloud_native_operation in ['apply','activate']
  block:
  - ansible.builtin.command:
      argv: '{{ nc_occ + ["user_oidc:providers","--output=json"] }}'
    changed_when: false
    register: nc_browser_provider
  - ansible.builtin.assert:
      that:
      - nc_browser_provider.stdout_lines | length == 1
      - (nc_browser_provider.stdout | from_json).identifier == 'perkforge-nextcloud'
      - (nc_browser_provider.stdout | from_json).clientId == 'nextcloud'
      - (nc_browser_provider.stdout | from_json).discoveryEndpoint == nextcloud_sso_issuer + '/.well-known/openid-configuration'
      - (nc_browser_provider.stdout | from_json).id | int > 0
      - nc_provider_records | length == 0 or (nc_browser_provider.stdout | from_json).id | int == nextcloud_provider_id | int
  - name: Verify callback from browser-facing login before permitting activation
    ansible.builtin.command:
      argv:
      - '{{ ansible_playbook_python }}'
      - '{{ playbook_dir }}/verify-browser-callback.py'
      - --run
      - --origin
      - '{{ nextcloud_sso_origin }}'
      - --issuer
      - '{{ nextcloud_sso_issuer }}'
      - --callback-path
      - '{{ nextcloud_sso_callback_path }}'
      - --provider-id
      - '{{ (nc_browser_provider.stdout | from_json).id | string }}'
      - --ca-file
      - '{{ nextcloud_ca_file }}'
    changed_when: false
    no_log: true
- ansible.builtin.command:
    argv: '{{ nc_occ + ["user_oidc:provider","perkforge-nextcloud","--group-whitelist-regex=" + (nc_allow if nextcloud_native_operation == "activate" else nc_deny)] }}'
  when: nextcloud_native_operation in ['activate','rollback'] and nc_provider_records[0].settings.groupWhitelistRegex != (nc_allow if nextcloud_native_operation == 'activate' else nc_deny)
  changed_when: true
- ansible.builtin.command:
    argv: '{{ nc_occ + ["user_oidc:providers","--output=json"] }}'
  changed_when: false
  register: nc_provider_after
- ansible.builtin.assert:
    that:
    - nc_provider_after.stdout_lines | length == 1
    - (nc_provider_after.stdout_lines[0] | from_json).identifier == 'perkforge-nextcloud'
    - nextcloud_native_operation not in ['activate','rollback'] or (nc_provider_after.stdout_lines[0] | from_json).settings.groupWhitelistRegex == (nc_allow if nextcloud_native_operation == 'activate' else nc_deny)
- ansible.builtin.include_tasks: native-credential-check.yaml
  vars:
    nc_credential_provider_id: '{{ (nc_provider_after.stdout_lines[0] | from_json).id }}'
  when: nextcloud_native_operation == 'apply' and nc_provider_records | length == 0
